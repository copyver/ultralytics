task: semantic
mode: train
model: yolo26x-sem-ade20k.pt
data: dataset.yaml # The launcher supplies the prepared hair dataset path.
name: yolo26x_hair_merged_1024_ade20k
pretrained: true
resume: false
imgsz: 1024
device: [0, 1, 2, 3]
batch: 64 # Total across all devices.
epochs: 30
patience: 8
save_period: 5
seed: 42
optimizer: AdamW
lr0: 0.0001
lrf: 0.05
cos_lr: true
warmup_epochs: 1.0
warmup_bias_lr: 0.0
mosaic: 0.0
close_mosaic: 0
degrees: 3.0
translate: 0.03
scale: 0.2
hsv_s: 0.3
hsv_v: 0.2
